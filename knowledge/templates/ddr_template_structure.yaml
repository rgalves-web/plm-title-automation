    B2: DISCLAIMER
    B6: '1. The legal description furnished is assumed to be correct.


      2. The undersigned does not assume any responsibility for matters legal in character.  Likewise,
      neither the undersigned does not render any opinion as to title to the property
      in question or any interest therein. Any “mineral-ownership reporting” and various
      ownership comments in the runsheet are provided merely as an aid to the examiner
      and should not be relied upon.


      3. Any maps, deed plots, or plats attached are included for the sole purpose
      of assisting the examiner in visualizing the subject property.  The undersigned
      has not made a survey of the subject property and therefore assumes no responsibility
      in connection with such matters.


      4. This runsheet and all information contained thereon shall become the property
      of ABC, LLC and its subsidiaries.  Any future use or publication of this information
      shall be made at the sole discretion of ABC, LLC.


      5. The undersigned shall not be required to give testimony or attendance in
      court by reason of preparation of this runsheet with reference to the property
      in question unless arrangements have been made previously therefore.


      6. This report should be considered cursory in nature regarding mineral ownership
      prior to the current mineral owner.  Per client request, all instruments containing
      conveyances of real property are included.


      7. The undersigned does not assume any responsibility for errors or omissions
      in the runsheet caused by omissions and/or mis-filings within the various records
      searched.  In any event, any and all liability shall be limited to actual amounts
      paid to the undersigned for the preparation of this Runsheet.        '
